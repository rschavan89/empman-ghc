# Employee Manager Application Configuration
# Spring Boot Configuration File for Employee Management System

# Application Name and Description
spring.application.name=employee-manager
spring.application.description=Employee Management System

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Logging Configuration
logging.level.root=INFO
logging.level.com.empman=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# H2 Database Configuration
# H2 is an in-memory database perfect for development
# JDBC URL: jdbc:h2:mem:empmandb
# Driver: org.h2.Driver

spring.datasource.url=jdbc:h2:mem:empmandb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console Configuration
# Access at: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.trace=false
spring.h2.console.settings.web-allow-others=false

# JPA/Hibernate Configuration
# Automatically creates database schema based on entities
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.open-in-view=false

# Jackson Configuration
# JSON serialization and deserialization settings
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=true
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null

# Error Handling Configuration
server.error.include-message=always
server.error.include-stacktrace=never
server.error.include-binding-errors=always

